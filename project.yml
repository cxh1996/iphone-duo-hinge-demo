# XcodeGen 工程描述文件
# 目的：让工程可以「纯文本」存在仓库里，在 CI 的 macOS 机器上现场生成 .xcodeproj
# 这样 Windows 上不需要（也无法）生成 xcodeproj

name: HingeDemo

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.1"          # iPhone Duo 铰链 API 需要 iOS 27.1 SDK
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  HingeDemo:
    type: application
    platform: iOS
    sources:
      - path: HingeDemo
        excludes:
          - "Info.plist"     # 由下面的 info 段生成，不能作为资源重复打包
    info:
      path: HingeDemo/Info.plist
      properties:
        CFBundleDisplayName: HingeDemo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hingedemo
        TARGETED_DEVICE_FAMILY: "1,2"
        # 用 Swift 5 语言模式，避开严格并发对 onHingeChange 闭包里写 @State 的报错
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  HingeDemo:
    build:
      targets:
        HingeDemo: all
    run:
      config: Debug
    archive:
      config: Release
